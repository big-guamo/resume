baseURL: "https://big-guamo.github.io/resume/"
languageCode: "zh-cn"
title: "guyi's Blog"
theme: ["PaperMod"]

enableRobotsTXT: true

pagination:
  pagerSize: 10

params:
  env: production
  title: "guyi's Blog"
  description: "AI, Autonomous Driving, Engineering and Thoughts"
  author: "guyi"

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: "Hi, I'm Gu Yi."
    Eyebrow: "Algorithms & Autonomous Driving"
    Content: "Notes on AI, autonomous driving, world models, engineering, and investing."
    Experience:
      - company: "Yinwang"
        context: "Huawei Intelligent Automotive Solution BU"
        role: "Algorithm Engineer"
        team: "ADS Research"
        start: "2025"
        end: "Present"
    Education:
      - institution: "National University of Singapore"
        degree: "Master's in Electrical Engineering"
        start: "2023"
        end: "2025"
      - institution: "Soochow University"
        degree: "Bachelor's in Electronic Information Engineering"
        start: "2019"
        end: "2023"

  socialIcons:
    - name: github
      url: "https://github.com/big-guamo"
    - name: email
      url: "mailto:guyibigger@gmail.com"

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10

    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20

    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30

    - identifier: search
      name: 搜索
      url: /search/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

caches:
  images:
    dir: :cacheDir/images
